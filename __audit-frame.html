<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#888}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe><pre id="audit-report">PENDING</pre><script>
const q = new URLSearchParams(location.search);
const w = +(q.get('w') || 390), h = +(q.get('h') || 844);
const u = q.get('u') || '/index.html';
const clicks = (q.get('click') || '').split('|').filter(Boolean);
const measure = q.get('measure') === '1';
const f = document.getElementById('f');
f.style.width = w + 'px';
f.style.height = h + 'px';
window.__errs = [];
f.addEventListener('error', e => window.__errs.push('iframe load err: ' + e.message));
window.addEventListener('error', e => window.__errs.push('parent err: ' + e.message));
f.src = u;
f.addEventListener('load', () => {
  const iw = f.contentWindow;
  iw.addEventListener('error', e => window.__errs.push('iframe js err: ' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno));
  const oc = iw.console.error.bind(iw.console);
  iw.console.error = (...a) => { window.__errs.push('console.error: ' + a.map(String).join(' ')); oc(...a); };
});

const waits = clicks.map((sel, i) => new Promise(res => setTimeout(() => {
  let r = 'click ' + sel + ': ';
  try { const t = f.contentDocument.querySelector(sel); if (t) { t.click(); r += 'ok'; } else r += 'MISSING'; }
  catch (e) { r += 'ERR ' + e.message; }
  console.log(r); res();
}, 1200 + i * 900)));

function fmtEl(el) {
  const r = el.getBoundingClientRect();
  const cs = f.contentWindow.getComputedStyle(el);
  return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + String(el.className).split(' ').join('.') +
    ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' fs=' + cs.fontSize;
}

const mode = q.get('mode');
if (q.get('sandbox') === '1') { f.setAttribute('sandbox', 'allow-scripts allow-modals'); }
const scrollSel = q.get('scrollSel');
if (mode === 'orient') setTimeout(() => { f.style.width = '780px'; f.style.height = '390px'; }, 2600);
if (mode === 'orient-back') setTimeout(() => { f.style.width = w + 'px'; f.style.height = h + 'px'; }, 2600);
if (scrollSel) setTimeout(() => { try { f.contentDocument.querySelector(scrollSel).scrollIntoView(); } catch (e) {} }, 2400);

Promise.all(waits).then(() => new Promise(res => setTimeout(res, 1600))).then(() => {
  if (q.get('perf') === 'surface') {
    return new Promise(res => {
      const d = f.contentDocument;
      const btn = d.querySelector('#fit-surface');
      const t0 = performance.now();
      btn ? btn.click() : console.log('no #fit-surface');
      setTimeout(() => {
        document.getElementById('audit-report').textContent = 'AUDIT-START\nsurface grid-search (3550 SEIR solves) took ' + Math.round(performance.now() - t0) + 'ms (desktop headless; a mid-range phone is 4-6x slower)\nAUDIT-END';
        res();
      }, 120);
    });
  }
  if (!measure) return;
  const d = f.contentDocument, win = f.contentWindow;
  const out = [];
  out.push('=== viewport ' + w + 'x' + h + ' url=' + u);
  // 1. horizontal overflow
  const se = d.scrollingElement;
  out.push('docScrollW=' + se.scrollWidth + ' clientW=' + se.clientWidth + ' overflowX=' + (se.scrollWidth > se.clientWidth));
  const bad = [];
  d.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 1 && (r.right > se.clientWidth + 1 || r.left < -1)) {
      const st = win.getComputedStyle(el);
      let anc = el, scrollable = false;
      while (anc && anc !== d.body) { const s = win.getComputedStyle(anc); if (/(auto|scroll)/.test(s.overflowX)) { scrollable = true; break; } anc = anc.parentElement; }
      if (!scrollable) bad.push(fmtEl(el) + ' right=' + Math.round(r.right));
    }
  });
  out.push(bad.length ? 'UNSCROLLABLE-OVERFLOW:\n  ' + bad.slice(0, 12).join('\n  ') : 'no unscrollable overflow');
  // 2. touch targets
  const small = [];
  d.querySelectorAll('button, a, input, textarea, select, [role="button"]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    if (r.height < 44 || r.width < 44) {
      const st = win.getComputedStyle(el);
      const mt = parseFloat(st.marginTop) + parseFloat(st.marginBottom);
      small.push(fmtEl(el) + (r.height + mt < 44 ? '  <<H=' + Math.round(r.height + mt) : '') + (r.width < 44 ? '  <<W=' + Math.round(r.width) : ''));
    }
  });
  out.push(small.length ? 'TOUCH TARGETS <44:\n  ' + small.join('\n  ') : 'all interactive >=44px');
  // 3. input font sizes (iOS zoom)
  const zoom = [];
  d.querySelectorAll('input, textarea, select').forEach(el => {
    const cs = win.getComputedStyle(el);
    if (parseFloat(cs.fontSize) < 16) zoom.push(fmtEl(el));
  });
  out.push(zoom.length ? 'INPUTS <16px (iOS zoom on focus):\n  ' + zoom.join('\n  ') : 'inputs >=16px');
  // 4. canvas stats
  d.querySelectorAll('canvas').forEach(cv => {
    out.push('canvas ' + (cv.id || '?') + ' css=' + cv.clientWidth + 'x' + cv.clientHeight + ' attr=' + cv.width + 'x' + cv.height + ' dpr=' + win.devicePixelRatio);
  });
  // 5. body font / measure
  const p = d.querySelector('.prose p');
  if (p) { const cs = win.getComputedStyle(p); out.push('prose p fs=' + cs.fontSize + ' lh=' + cs.lineHeight + ' measureW=' + Math.round(p.getBoundingClientRect().width) + 'px'); }
  // 6. perf: hammer the first slider
  const sl = d.querySelector('input[type="range"]');
  if (sl) {
    const t0 = performance.now(); const N = 24;
    for (let i = 0; i < N; i++) { sl.value = +sl.min + (i / (N - 1)) * (+sl.max - +sl.min); sl.dispatchEvent(new Event('input', { bubbles: true })); }
    out.push('slider: ' + N + ' input events -> ' + Math.round(performance.now() - t0) + 'ms total, ' + (Math.round((performance.now() - t0) * 10 / N) / 10) + 'ms/event (desktop headless; phone = several x slower)');
  }
  // 7. instrument dump
  const ib = d.querySelector('.instrument-body');
  if (ib) {
    out.push('instrument-body children: ' + [...ib.children].map(c => c.tagName + '.' + String(c.className).split(' ')[0] + '(' + Math.round(c.getBoundingClientRect().height) + 'px)').join(', '));
    const canvas = ib.querySelector('canvas');
    if (canvas) { const ctx = canvas.getContext('2d'); out.push('canvas sample px[10,10]=' + [...ctx.getImageData(10, 10, 1, 1).data].join(',')); }
  }
  out.push('errors: ' + (window.__errs.length ? '\n  ' + window.__errs.join('\n  ') : 'none'));
  document.getElementById('audit-report').textContent = 'AUDIT-START\n' + out.join('\n') + '\nAUDIT-END';
});

const rep = document.getElementById('audit-report');
if (measure) { /* filled async */ }
</script></body></html>
